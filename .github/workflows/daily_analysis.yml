name: Daily Fund Analysis

on:
  schedule:
    - cron: '0 10 * * 1-5'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run analysis
        env:
          DFA_FUND_CODES: ${{ secrets.FUND_CODES }}
          DFA_LLM_PRIMARY_MODEL: deepseek/deepseek-chat
          DFA_LLM_PRIMARY_API_KEY: ${{ secrets.LLM_PRIMARY_API_KEY }}
          DFA_LLM_PRIMARY_BASE_URL: ${{ secrets.LLM_PRIMARY_BASE_URL }}
          DFA_LLM_FALLBACK_MODEL: deepseek/deepseek-chat
          DFA_LLM_FALLBACK_API_KEY: ${{ secrets.LLM_PRIMARY_API_KEY }}
          DFA_LLM_FALLBACK_BASE_URL: ${{ secrets.LLM_PRIMARY_BASE_URL }}
          DFA_EMAIL_SMTP_HOST: smtp.qq.com
          DFA_EMAIL_SMTP_PORT: '465'
          DFA_EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          DFA_EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          DFA_EMAIL_RECEIVERS: ${{ secrets.EMAIL_RECEIVERS }}
        run: python main.py run

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fund-reports-${{ github.run_number }}
          path: data/
          retention-days: 30
